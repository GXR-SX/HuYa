name: 虎牙虎粮自动发放

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      rooms:
        description: '房间号, 逗号分隔'
        required: false
        default: ''

# 和 keepalive.yml 共用同一把锁：Cookie 是「滚动失效」的，两个任务绝不能同时续期
concurrency:
  group: huya-cookie
  cancel-in-progress: false

jobs:
  send-hl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 Python 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 包
        run: pip install -r requirements.txt

      - name: 安装 Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # 手动触发也必须恢复缓存：缓存放的是上一轮续期后的最新 Cookie，
      # 删掉它等于主动退回那张已经被轮换作废的旧快照。
      - name: PRE:恢复登录态缓存
        uses: actions/cache/restore@v4
        with:
          path: .huya_cookie
          key: huya-cookie-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            huya-cookie-

      - name: PRE:检查登录态
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_COOKIES: ${{ secrets.HUYA_COOKIES }}
        run: |
          if [ -z "$HUYA_COOKIE" ] && [ -z "$HUYA_COOKIES" ] && ! ls .huya_cookie/*.txt >/dev/null 2>&1; then
            echo "❌ 未配置 Cookie，且缓存中没有可用登录态"
            exit 1
          fi

      - name: PRE:获取房间号
        id: get-rooms
        env:
          INPUT_ROOMS: ${{ github.event.inputs.rooms }}
          SECRET_ROOMS: ${{ secrets.HUYA_ROOMS }}
        run: |
          ROOMS="$INPUT_ROOMS"
          if [ -z "$ROOMS" ]; then
            ROOMS="$SECRET_ROOMS"
          fi
          if [ -z "$ROOMS" ]; then
            echo "❌ 未配置 HUYA_ROOMS"
            exit 1
          fi
          {
            echo 'rooms<<EOF'
            echo "$ROOMS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: PRE:Cookie 体检
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_COOKIES: ${{ secrets.HUYA_COOKIES }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python tools/cookie_doctor.py

      - name: 运行虎粮发放
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_COOKIES: ${{ secrets.HUYA_COOKIES }}
          HUYA_ROOMS: ${{ steps.get-rooms.outputs.rooms }}
          SEND_KEY: ${{ secrets.SEND_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          HUYA_COOKIE_SYNC: '1'
          GH_SECRET_DRY_RUN: '0'
        run: |
          mkdir -p .huya_cookie
          python main.py

      - name: POST:回写报告
        if: always()
        run: |
          if [ -f .huya_cookie/sync.json ]; then
            cat .huya_cookie/sync.json
          else
            echo "⚠️ 没有生成回写报告（任务可能在登录前就中断了）"
          fi

      - name: POST:检查登录态缓存
        id: check-cookie
        if: always()
        run: |
          if find .huya_cookie -name "*.txt" -type f | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: POST:保存登录态缓存
        if: always() && steps.check-cookie.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: .huya_cookie
          key: huya-cookie-${{ github.run_id }}-${{ github.run_attempt }}
